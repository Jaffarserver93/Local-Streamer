<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#121212" />
  <title>Local Stream</title>

  <!-- Video.js v8 - served locally (no CDN dependency) -->
  <link href="/video-js.css" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>

  <!-- Header -->
  <header class="app-header">
    <span class="logo">📺</span>
    <h1>Local Stream</h1>
    <div class="header-right">
      <span id="syncIndicator" class="sync-indicator" title="Sync status">⚡</span>
      <button id="folderToggleBtn" class="icon-btn" title="Change video folder">📁</button>
    </div>
  </header>

  <!-- Folder Panel -->
  <div id="folderPanel" class="folder-panel" hidden>
    <div class="folder-panel-inner">
      <p class="folder-panel-title">Video Source</p>
      <div class="folder-option">
        <button id="browseBtn" class="browse-btn">🗂 Browse &amp; pick folder</button>
        <span class="folder-note">Local playback only (localhost / https)</span>
      </div>
      <div class="folder-divider"><span>or type a server path</span></div>
      <div class="folder-option folder-path-row">
        <input id="folderPathInput" class="folder-path-input" type="text"
          placeholder="/sdcard/Download  or  /home/user/Videos"
          spellcheck="false" autocomplete="off" />
        <button id="setFolderBtn" class="set-folder-btn">Apply</button>
      </div>
      <p id="folderCurrentPath" class="folder-current-path"></p>
      <p id="folderError" class="folder-error" hidden></p>
    </div>
  </div>

  <main class="app-main">

    <!-- Player -->
    <section class="player-section">
      <div class="player-wrapper">
        <video id="videoPlayer" class="video-js vjs-default-skin"
          preload="auto" playsinline></video>

        <!-- Double-tap seek overlays -->
        <div id="seekOverlayLeft"  class="seek-overlay seek-left"  aria-hidden="true">
          <div class="seek-ripple"></div>
          <div class="seek-label"><span class="seek-arrows">&#9664;&#9664;</span><span class="seek-secs">5 sec</span></div>
        </div>
        <div id="seekOverlayRight" class="seek-overlay seek-right" aria-hidden="true">
          <div class="seek-ripple"></div>
          <div class="seek-label"><span class="seek-secs">5 sec</span><span class="seek-arrows">&#9654;&#9654;</span></div>
        </div>

        <div id="playerPlaceholder" class="player-placeholder">
          <div class="placeholder-icon">&#9654;</div>
          <p>Pick a video from the library below</p>
        </div>
      </div>

      <div id="nowPlaying" class="now-playing" hidden>
        <span class="now-playing-label">NOW PLAYING</span>
        <span id="nowPlayingName" class="now-playing-name"></span>
      </div>
    </section>

    <!-- Library -->
    <section class="library-section">
      <div class="library-header">
        <h2>Library</h2>
        <div class="library-header-actions">
          <label id="addToLibraryBtn" class="add-btn" title="Add video to library">
            ＋ Add video
            <input id="uploadInput" type="file" accept="video/*" hidden />
          </label>
          <button id="refreshBtn" class="icon-btn refresh-icon" title="Refresh library">&#8635;</button>
          <button id="clearHlsBtn" class="icon-btn" title="Clear HLS cache (fixes black screen)">🗑</button>
        </div>
      </div>
      <div id="uploadStatus" class="upload-status" hidden></div>
      <div id="libraryStatus" class="library-status" hidden></div>
      <ul id="videoList" class="video-list" role="list"></ul>
    </section>

  </main>

  <footer class="app-footer">
    <p>
      Same Wi-Fi? Open <code>http://&lt;server-ip&gt;:&lt;port&gt;</code> on any device — everyone syncs automatically.
    </p>
  </footer>

  <!-- Video.js v8 - served locally -->
  <script src="/video.min.js"></script>
  <!-- Socket.io client - served as a local static file (proxy blocks /socket.io/ path) -->
  <script src="/socket.io.min.js"></script>
  <script src="/script.js"></script>
</body>
</html>
